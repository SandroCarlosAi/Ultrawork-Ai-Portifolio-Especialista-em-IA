<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=DM+Sans:wght@300;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#0b0b0a;color:#f5f5f0;
 font-family:'DM Sans',sans-serif;display:flex;flex-direction:column;
 justify-content:space-between;padding:72px 80px;overflow:hidden;position:relative}
.malha{position:absolute;inset:0;display:grid;grid-template-columns:repeat(24,1fr);
 grid-template-rows:repeat(13,1fr);gap:3px;padding:3px;opacity:1}
.malha i{background:#4ade9a;border-radius:2px}
.veu{position:absolute;inset:0;background:linear-gradient(100deg,#0b0b0a 30%,rgba(11,11,10,.86) 52%,rgba(11,11,10,.34) 100%)}
.topo{display:flex;justify-content:space-between;align-items:center;

 color:rgba(245,245,240,.62);position:relative;z-index:1}
h1{font-family:'Cormorant Garamond',serif;font-size:104px;font-weight:400;
 line-height:.96;letter-spacing:-.035em;position:relative;z-index:1;max-width:15ch}
h1 em{font-style:italic;color:#4ade9a}
.base{display:flex;justify-content:space-between;align-items:flex-end;
 position:relative;z-index:1}
.sub{font-size:21px;font-weight:300;color:rgba(245,245,240,.62);max-width:44ch;line-height:1.45}
.tag{font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:#4ade9a;
 border:1px solid rgba(74,222,154,.45);border-radius:999px;padding:11px 22px;white-space:nowrap}
</style></head><body>
<div class="malha" id="m"></div>
<div class="veu"></div>
<div class="topo"><span>UltraWork AI</span><span>Belo Horizonte · MG</span></div>
<h1>Inteligência que <em>transforma</em> negócios.</h1>
<div class="base">
  <p class="sub">Sandro Carlos Silva — sistemas de IA que operam enquanto você dorme.</p>
  <span class="tag">Especialista em IA</span>
</div>

for(var i=0;i<e;i++){var c=document.createElement('i');var v=r();
 c.style.opacity=(v>.82?(.16+v*.44):0).toFixed(3);f.appendChild(c);}
m.appendChild(f);
</script></body></html>
